name: Fingerprint Driver CI & Packaging Validation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'fingerprint/**'
      - '.github/workflows/fingerprint-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'fingerprint/**'
      - '.github/workflows/fingerprint-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-matrix-build:
    name: Build (${{ matrix.compiler }} - ${{ matrix.sanitizer || 'Standard' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [none, asan-ubsan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ${{ matrix.compiler }} \
            meson \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libgudev-1.0-dev \
            libgusb-dev \
            libpixman-1-dev \
            libnss3-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            valgrind \
            umockdev

      - name: Compile and Run Standalone Unit Test
        env:
          CC: ${{ matrix.compiler }}
        run: |
          CFLAGS="-Wall -Wextra -Werror -pedantic -std=gnu11 $(pkg-config --cflags glib-2.0 gudev-1.0)"
          LDFLAGS="$(pkg-config --libs glib-2.0 gudev-1.0)"

          if [ "${{ matrix.sanitizer }}" = "asan-ubsan" ]; then
            CFLAGS="$CFLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"
            LDFLAGS="$LDFLAGS -fsanitize=address,undefined"
          fi

          echo "Compiling test-crfpmoc-unit with $CC..."
          read -r -a cflags <<< "$CFLAGS"
          read -r -a ldflags <<< "$LDFLAGS"
          "$CC" "${cflags[@]}" \
            -DHAVE_UDEV=1 \
            -I./fingerprint/driver \
            -I./fingerprint/tests \
            fingerprint/tests/test-crfpmoc-unit.c \
            fingerprint/driver/crfpmoc-proto.c \
            -o test-crfpmoc-unit \
            "${ldflags[@]}"

          echo "Running standalone unit test..."
          ./test-crfpmoc-unit --verbose

  pinned-upstream-path:
    name: Pinned Upstream Build Path (3v1n0/libfprint @ 5644259)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git meson ninja-build pkg-config \
            libglib2.0-dev libgudev-1.0-dev libgusb-dev libpixman-1-dev \
            libnss3-dev gobject-introspection libgirepository1.0-dev

      - name: Replay pinned clone + overlay + meson patch (configure-only)
        run: |
          set -euo pipefail
          PIN=56442591a5c302a906289f30988fb50fc3d82ed6
          git clone --depth 1 --branch feature/crfpmoc --single-branch \
            https://gitlab.freedesktop.org/3v1n0/libfprint.git crfpmoc-build
          git -C crfpmoc-build fetch --depth 1 origin "$PIN"
          git -C crfpmoc-build checkout --detach FETCH_HEAD
          test "$(git -C crfpmoc-build rev-parse HEAD)" = "$PIN"
          cp -f fingerprint/driver/crfpmoc* crfpmoc-build/libfprint/drivers/crfpmoc/
          test -f crfpmoc-build/libfprint/drivers/crfpmoc/crfpmoc-proto.c
          sed -i "s|'drivers/crfpmoc/crfpmoc-ec-transfer.c',|'drivers/crfpmoc/crfpmoc-ec-transfer.c',\n        'drivers/crfpmoc/crfpmoc-proto.c',|" crfpmoc-build/libfprint/meson.build
          grep -q "crfpmoc-proto.c" crfpmoc-build/libfprint/meson.build
          meson setup crfpmoc-build/build crfpmoc-build --prefix=/usr \
            -Ddrivers=default -Dintrospection=true -Dgtk-examples=false -Ddoc=false

  packaging-lint:
    name: Packaging Lint & Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Arch Linux PKGBUILD Lint (namcap)
        uses: docker://archlinux:base-devel@sha256:aecf5b39bd3139a951090dfb3d940f9317e4c5fca038c65fb49ac03910f7133e
        with:
          args: >
            bash -c "
            retry() {
              local n=0
              until \"$@\"; do
                n=$((n+1))
                [ \"$n\" -ge 4 ] && return 1
                echo \"::warning::Command failed (attempt $n/4), retrying in 15s\";
                sleep 15;
              done
            };
            retry pacman -Syu --disable-download-timeout --noconfirm namcap pacman-contrib base-devel git &&
            useradd -m builder &&
            su builder -c '
              cd fingerprint/packaging &&
              echo \"=== Checking PKGBUILD with namcap ===\" &&
              namcap_output=$(namcap PKGBUILD || true) &&
              printf \"%s\n\" \"$namcap_output\" &&
              if printf \"%s\n\" \"$namcap_output\" | grep -qE \"(^|[ :])E: \"; then
                echo \"namcap found errors (E: lines above)\";
                exit 1;
              fi
            '
            "

      - name: Fedora RPM Spec Lint (rpmlint & rpmspec)
        uses: docker://fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
        with:
          args: >
            bash -c "
            dnf install -y rpmlint rpm-build rpmdevtools &&
            cd fingerprint/packaging &&
            echo \"=== Validating RPM Spec syntax ===\" &&
            rpmspec -q --srpm libfprint-crfpmoc.spec &&
            echo \"=== Running rpmlint on spec file ===\" &&
            rpmlint_output=$(rpmlint libfprint-crfpmoc.spec || true) &&
            printf \"%s\n\" \"$rpmlint_output\" &&
            if printf \"%s\n\" \"$rpmlint_output\" | grep -qE \"(^|[ :])E: \"; then
              echo \"rpmlint found errors (E: lines above)\";
              exit 1;
            fi
            "
