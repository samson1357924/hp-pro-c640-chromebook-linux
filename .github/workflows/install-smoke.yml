          stat -c '%u:%a %n' /var/lib/cros-enablement/pam-selection /var/lib/cros-enablement/pam-selection.saved
          setpriv --reuid=1000 --regid=1000 --clear-groups \
            env PATH="/usr/local/nonroot-bin:/usr/bin:/bin" LOG_FILE=/tmp/pam-e2e-nonroot.log \
            bash -c '
              source /workspace/lib/pam.sh
              DISTRO_FAMILY=debian DISTRO_ID=ubuntu
              export DISTRO_FAMILY DISTRO_ID
              rollback_component "fingerprint"
              disable_pam_fingerprint
            '
          compare_with_baseline
          test ! -e /var/lib/cros-enablement/pam-selection
          test ! -e /var/lib/cros-enablement/pam-selection.saved
