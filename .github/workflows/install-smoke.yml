name: Install Smoke Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ec/**'
      - 'keyboard/**'
      - 'scripts/**'
      - 'lib/**'
      - 'setup.sh'
      - 'tests/**'
      - '.github/workflows/install-smoke.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ec/**'
      - 'keyboard/**'
      - 'scripts/**'
      - 'lib/**'
      - 'setup.sh'
      - 'tests/**'
      - '.github/workflows/install-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # container runs default to `sh` (dash) unless bash is forced
    shell: bash

jobs:
  ec-install-smoke:
    name: EC Install / Runtime / Uninstall Smoke Test
    runs-on: ubuntu-latest
    container:
      image: ubuntu@sha256:d78ab76437b1afc5f01e223d6bf0172763f404bb166441328845adbef44518cb
      options: --user root
    steps:
      - name: Prepare Minimal Container Environment
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends git ca-certificates bash coreutils sudo python3

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stub Boot-Time Tools (systemctl / udevadm / ectool)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $1 is literal stub content, not this script's arg
          # systemctl: is-enabled/is-active must FAIL like on a fresh system
          # (unit not yet enabled/started), so manifest service records are
          # truthful; everything else (incl. daemon-reload) is a no-op.
          printf '%s\n' '#!/bin/bash' 'case "$*" in' '  *is-enabled*|*is-active*|*is-system-running*|*is-failed*) exit 1;;' '  *) exit 0;;' 'esac' > /usr/local/bin/systemctl
          chmod +x /usr/local/bin/systemctl
          printf '#!/bin/bash\nexit 0\n' > /usr/local/bin/udevadm
          chmod +x /usr/local/bin/udevadm
          printf '#!/bin/bash\nexit 0\n' > /usr/local/bin/ectool
          chmod +x /usr/local/bin/ectool

      - name: Dry-Run Coverage (no side effects)
        run: |
          set -euo pipefail
          ./ec/install-ec.sh --install --dry-run
          ./ec/install-ec.sh --enable-battery-limit --dry-run

      - name: Install EC Tools (real root, simulates target system)
        run: |
          set -euo pipefail
          # Non-root USER exercises the plugdev was_member snapshot path.
          useradd -m smoketest
          USER=smoketest ./ec/install-ec.sh --install
          USER=smoketest ./ec/install-ec.sh --enable-battery-limit

      - name: "Assert Installed Layout Is Self-Sufficient (regression: missing libs)"
        run: |
          set -euo pipefail
          test -x /usr/local/bin/c640-ec-control
          test -f /usr/local/lib/c640-ec/logger.sh
          test -f /usr/local/lib/c640-ec/syscheck.sh
          /usr/local/bin/c640-ec-control help > /dev/null
          /usr/local/bin/c640-ec-control status > /dev/null 2>&1 || true
          test -f /etc/systemd/system/c640-battery-limit.service
          test -f /usr/lib/systemd/system-sleep/c640-ec-sleep.sh

      - name: Assert CLI Validation
        run: |
          set -euo pipefail
          if /usr/local/bin/c640-ec-control battery-limit 10 > /dev/null 2>&1; then
            echo "::error::battery-limit accepted out-of-range value 10"
            exit 1
          fi
          if /usr/local/bin/c640-ec-control kblight 101 > /dev/null 2>&1; then
            echo "::error::kblight accepted out-of-range value 101"
            exit 1
          fi
          # 0 is a valid brightness (regression: (( )) arithmetic exit trap)
          if ! /usr/local/bin/c640-ec-control kblight 0 > /dev/null 2>&1; then
            echo "::error::kblight 0 must be accepted (range 0-100)"
            exit 1
          fi
          if /usr/local/bin/c640-ec-control fan-speed 0 > /dev/null 2>&1; then
            echo "::error::fan-speed accepted non-positive value 0"
            exit 1
          fi

      - name: Assert Repo (Dev) Layout Still Works
        run: |
          set -euo pipefail
          ./scripts/c640-ec-control.sh help > /dev/null

      - name: Uninstall Round-Trip (manifest rollback)
        run: |
          set -euo pipefail
          USER=smoketest ./ec/install-ec.sh --uninstall
          test ! -e /usr/local/bin/c640-ec-control
          test ! -e /usr/local/lib/c640-ec/logger.sh
          test ! -e /usr/local/lib/c640-ec/syscheck.sh
          test ! -e /etc/systemd/system/c640-battery-limit.service
          test ! -e /usr/lib/systemd/system-sleep/c640-ec-sleep.sh
          test ! -e /etc/udev/rules.d/60-cros-ec.rules
          # installer-created plugdev membership must be removed
          if id -nG smoketest | tr ' ' '\n' | grep -qx plugdev; then
            echo "::error::plugdev membership created by installer was not removed"
            exit 1
          fi
          # manifest must be fully drained (no records/services/groups left)
          python3 -c '
          import json, sys
          d = json.load(open("/var/lib/cros-enablement/install-manifest.json"))
          for key in ("records", "services", "groups"):
              if d.get(key):
                  print(f"::error::manifest {key} not empty after uninstall: {d[key]}")
                  sys.exit(1)
          '

  keyboard-install-smoke:
    name: Keyboard Install / Backlight Sync Smoke Test
    runs-on: ubuntu-latest
    container:
      image: ubuntu@sha256:d78ab76437b1afc5f01e223d6bf0172763f404bb166441328845adbef44518cb
      options: --user root
    steps:
      - name: Prepare Minimal Container Environment
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends git ca-certificates bash coreutils sudo python3 dbus

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stub Boot-Time Tools (systemctl / udevadm / systemd-hwdb)
        run: |
          set -euo pipefail
          printf '%s\n' '#!/bin/bash' 'case "$*" in' '  *is-enabled*|*is-active*|*is-system-running*|*is-failed*) exit 1;;' '  *) exit 0;;' 'esac' > /usr/local/bin/systemctl
          chmod +x /usr/local/bin/systemctl
          printf '#!/bin/bash\nexit 0\n' > /usr/local/bin/udevadm
          chmod +x /usr/local/bin/udevadm
          printf '#!/bin/bash\nexit 0\n' > /usr/local/bin/systemd-hwdb
          chmod +x /usr/local/bin/systemd-hwdb
          printf '#!/bin/bash\nexit 0\n' > /usr/local/bin/dbus-monitor
          chmod +x /usr/local/bin/dbus-monitor
          printf '#!/bin/bash\nexit 0\n' > /usr/local/bin/gdbus
          chmod +x /usr/local/bin/gdbus

      - name: Dry-Run Coverage (no side effects)
        run: |
          set -euo pipefail
          ./keyboard/install-keyboard.sh --dry-run
          # assert no side effects
          test ! -e /etc/udev/hwdb.d/90-chromebook-keyboard.hwdb
          test ! -e /etc/udev/rules.d/61-chromeos-kbd-backlight.rules
          test ! -e /usr/local/bin/c640-kbd-backlight-sync
          test ! -e /etc/systemd/user/c640-kbd-backlight-sync.service
          test ! -e /usr/lib/systemd/system-sleep/c640-kbd-backlight-sleep.sh
          if [ -f /var/lib/cros-enablement/install-manifest.json ]; then
            python3 -c 'import json,sys; d=json.load(open("/var/lib/cros-enablement/install-manifest.json")); assert not d.get("records") and not d.get("services") and not d.get("groups"), f"manifest not empty after dry-run: {d}"'
          fi
          # dry-run with keyd
          ./keyboard/install-keyboard.sh --with-keyd --dry-run
          test ! -e /etc/keyd/cros.conf
          test ! -e /etc/keyd/default.conf
          test ! -L /etc/keyd/default.conf

      - name: Install Keyboard (real root, simulates target system)
        run: |
          set -euo pipefail
          useradd -m smoketest || true
          USER=smoketest ./keyboard/install-keyboard.sh --install
          test -f /etc/udev/hwdb.d/90-chromebook-keyboard.hwdb
          test -f /etc/udev/rules.d/61-chromeos-kbd-backlight.rules
          test -x /usr/local/bin/c640-kbd-backlight-sync
          test -f /etc/systemd/user/c640-kbd-backlight-sync.service
          test -f /usr/lib/systemd/system-sleep/c640-kbd-backlight-sleep.sh
          # permissions
          test "$(stat -c %a /etc/udev/hwdb.d/90-chromebook-keyboard.hwdb)" = "644"
          test "$(stat -c %a /etc/udev/rules.d/61-chromeos-kbd-backlight.rules)" = "644"
          test "$(stat -c %a /usr/local/bin/c640-kbd-backlight-sync)" = "755"
          test "$(stat -c %a /etc/systemd/user/c640-kbd-backlight-sync.service)" = "644"
          test "$(stat -c %a /usr/lib/systemd/system-sleep/c640-kbd-backlight-sleep.sh)" = "755"
          # Deployed backlight components must be byte-identical to the repo:
          # a stale daemon/unit/hook would silently drop the gsd-power
          # single-writer or ScreenSaver-defer fix (TROUBLESHOOTING.md §11).
          diff -u keyboard/c640-kbd-backlight-sync /usr/local/bin/c640-kbd-backlight-sync
          diff -u keyboard/systemd/c640-kbd-backlight-sync.service /etc/systemd/user/c640-kbd-backlight-sync.service
          grep -q '^StandardError=journal$' /etc/systemd/user/c640-kbd-backlight-sync.service
          diff -u keyboard/systemd/c640-kbd-backlight-sleep.sh /usr/lib/systemd/system-sleep/c640-kbd-backlight-sleep.sh
          /usr/local/bin/c640-kbd-backlight-sync --check > /dev/null 2>&1 || true
          /usr/local/bin/c640-kbd-backlight-sync --help > /dev/null

      - name: Install Keyboard Double-Install Idempotency
        run: |
          set -euo pipefail
          USER=smoketest ./keyboard/install-keyboard.sh --install
          USER=smoketest ./keyboard/install-keyboard.sh --install
          test -f /etc/udev/hwdb.d/90-chromebook-keyboard.hwdb
          test -f /etc/udev/rules.d/61-chromeos-kbd-backlight.rules
          python3 <<'PYEOF'
          import json, glob
          d=json.load(open("/var/lib/cros-enablement/install-manifest.json"))
          # first-wins: only single backup for hwdb
          hwdb_backups=glob.glob("/var/lib/cros-enablement/backups/keyboard/*90-chromebook*")
          assert len(hwdb_backups) <= 1, f"double-install created extra backups: {hwdb_backups}"
          # 5 records expected for keyboard (hwdb+udev+daemon+service+sleep)
          recs=d.get("records",[])
          assert len(recs) == 5, f"records={recs}"
          PYEOF

      - name: Install keyd Dual-Role (optional)
        run: |
          set -euo pipefail
          # keyd binary is deliberately absent in the container: the config is
          # still deployed, but no keyd service can be activated. Config-only
          # is explicitly accepted here so rc stays 0; a strict --with-keyd
          # would correctly return 3.
          USER=smoketest ./keyboard/install-keyboard.sh --with-keyd --keyd-config-only
          test -f /etc/keyd/cros.conf
          test ! -e /etc/keyd/default.conf
          test ! -L /etc/keyd/default.conf
          # keyd check already validated in lint job, but verify the deployed
          # config still carries the core dual-role fix. The old broad grep
          # ("leftmeta = overload") also matched the broken plain overload()
          # form, so it never guarded the regression.
          check_dualrole() {
            local conf="$1"
            # Positive: exact overloadt2(meta, capslock, <ms>) form.
            grep -qE '^[[:space:]]*leftmeta[[:space:]]*=[[:space:]]*overloadt2\([[:space:]]*meta[[:space:]]*,[[:space:]]*capslock[[:space:]]*,[[:space:]]*[0-9]+[[:space:]]*\)[[:space:]]*$' "$conf" || return 1
            # Negative: the known-broken plain overload() must not be present.
            if grep -qE '^[[:space:]]*leftmeta[[:space:]]*=[[:space:]]*overload[[:space:]]*\(' "$conf"; then
              return 1
            fi
            return 0
          }
          if ! check_dualrole /etc/keyd/cros.conf; then
            echo "::error::deployed keyd config lacks the precise overloadt2(meta, capslock, <ms>) dual-role fix (or still uses plain overload())"
            exit 1
          fi
          # Deployed file must be byte-identical to the repo source.
          diff -u keyboard/keyd/cros.conf /etc/keyd/cros.conf
          # Self-negative test: the new check must reject the old broken form
          # and accept the fixed form (temp files only, no repo changes).
          SELF_TEST=$(mktemp)
          printf 'leftmeta = overload(meta, capslock)\n' > "$SELF_TEST"
          if check_dualrole "$SELF_TEST"; then
            echo "::error::self-negative test failed: plain overload() was accepted"
            rm -f "$SELF_TEST"
            exit 1
          fi
          printf 'leftmeta = overloadt2(meta, capslock, 200)\n' > "$SELF_TEST"
          if ! check_dualrole "$SELF_TEST"; then
            echo "::error::self-positive test failed: overloadt2(...) was rejected"
            rm -f "$SELF_TEST"
            exit 1
          fi
          rm -f "$SELF_TEST"

      - name: Uninstall Round-Trip (manifest rollback)
        run: |
          set -euo pipefail
          USER=smoketest ./keyboard/install-keyboard.sh --uninstall
          test ! -e /usr/local/bin/c640-kbd-backlight-sync
          test ! -e /etc/systemd/user/c640-kbd-backlight-sync.service
          test ! -e /usr/lib/systemd/system-sleep/c640-kbd-backlight-sleep.sh
          test ! -e /etc/udev/rules.d/61-chromeos-kbd-backlight.rules
          # hwdb also removed
          test ! -e /etc/udev/hwdb.d/90-chromebook-keyboard.hwdb
          test ! -e /etc/keyd/cros.conf
          test ! -e /etc/keyd/default.conf
          test ! -L /etc/keyd/default.conf
          if id -nG smoketest 2> /dev/null | tr ' ' '\n' | grep -qx plugdev; then
            echo "::error::plugdev membership created by keyboard installer was not removed"
            exit 1
          fi
          python3 -c '
          import json, sys
          d = json.load(open("/var/lib/cros-enablement/install-manifest.json"))
          for key in ("records", "services", "groups"):
              if d.get(key):
                  print(f"::error::manifest {key} not empty after keyboard uninstall: {d[key]}")
                  sys.exit(1)
          '

  rollback-tests:
    name: Backup / Rollback Sandbox Tests
    runs-on: ubuntu-latest
    container:
      image: ubuntu@sha256:d78ab76437b1afc5f01e223d6bf0172763f404bb166441328845adbef44518cb
      options: --user root
    steps:
      - name: Prepare Minimal Container Environment
        run: |
          apt-get update -y
          # gcc builds the tiny setuid-root exec helper used by PAM-19 to model
          # a non-root caller with passwordless sudo.
          apt-get install -y --no-install-recommends git ca-certificates bash coreutils sudo python3 gcc libc6-dev

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Rollback Sandbox Tests
        run: |
          # shellcheck disable=SC2016 # $1 is literal stub content
          # systemctl stub so rollback_component's service restore works
          # (container has no systemd; python subprocess.run needs systemctl)
          printf '%s\n' '#!/bin/bash' 'case "$*" in' '  *is-enabled*|*is-active*|*is-system-running*|*is-failed*) exit 1;;' '  *) exit 0;;' 'esac' > /usr/local/bin/systemctl
          chmod +x /usr/local/bin/systemctl
          # Defense in depth: the PAM sandbox snippets strip /usr/sbin from
          # PATH, so an absent stub resolves to "not found" rather than to the
          # real tool. Make any accidental real-tool call fail LOUDLY instead
          # of rewriting the container's debconf DB / /var/lib/pam/seen.
          printf '%s\n' '#!/bin/bash' 'echo "REAL pam-auth-update called from sandbox tests" >&2' 'exit 99' > /usr/local/bin/pam-auth-update
          chmod +x /usr/local/bin/pam-auth-update
          bash tests/rollback-test.sh

  pam-profile-reversibility-e2e:
    name: PAM Profile Selection Reversibility (real pam-auth-update, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Re-review #13 finding #1: stub-only tests can self-prove. This job runs
      # the UNMODIFIED Debian/Ubuntu pam-auth-update and debconf tools inside a
      # throwaway ubuntu:24.04 container (never on the runner host).
      - name: Real install -> --package -> uninstall round-trip + sensitivity control
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" ubuntu:24.04 bash -s <<'EOS'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends \
            bash coreutils sed grep findutils python3 sudo debconf util-linux \
            gcc libc6-dev libpam-runtime libpam-fprintd
          test -f /usr/share/pam-configs/fprintd

          # Root container: transparent sudo passthrough so the production code
          # path is identical to a sudo host, without touching runner PAM.
          printf '#!/bin/bash\nexec "$@"\n' > /usr/local/bin/sudo
          chmod +x /usr/local/bin/sudo
          # rollback_component asks systemctl about restored services.
          printf '#!/bin/bash\ncase "$*" in *is-enabled*|*is-active*|*is-system-running*|*is-failed*) exit 1;; *) exit 0;; esac\n' > /usr/local/bin/systemctl
          chmod +x /usr/local/bin/systemctl

          read_selection() {
            debconf-show libpam-runtime \
              | sed -n 's/^  libpam-runtime\/profiles:[[:space:]]*//p' | tail -n 1
          }
          common_files=(/etc/pam.d/common-auth /etc/pam.d/common-account /etc/pam.d/common-session /etc/pam.d/common-session-noninteractive /etc/pam.d/common-password)
          saved_files=(/var/lib/pam/auth /var/lib/pam/account /var/lib/pam/password /var/lib/pam/session /var/lib/pam/session-noninteractive /var/lib/pam/seen)

          # Establish a genuine fprintd selection with the REAL tool. A bare
          # debconf-set-selections is NOT enough: the following --package lets
          # diff_profiles() derive the list from common-* + /var/lib/pam and
          # overwrites it without fprintd (verified with real tools). --enable
          # both injects pam_fprintd.so into common-auth and persists the
          # selection, so the sensitivity control below cannot be vacuous.
          sudo pam-auth-update --enable fprintd
          grep -qF pam_fprintd.so /etc/pam.d/common-auth \
            || { echo "baseline --enable did not write pam_fprintd.so to common-auth"; exit 1; }
          baseline_sel="$(read_selection)"
          grep -qF fprintd <<< "$baseline_sel" || { echo "baseline selection lost fprintd"; exit 1; }

          mkdir -p /root/baseline/etc/pam.d /root/baseline/var/lib/pam
          cp -a "${common_files[@]}" /root/baseline/etc/pam.d/
          cp -a /etc/pam.d/sudo /root/baseline/etc/pam.d/
          for f in "${saved_files[@]}"; do
            [ -e "$f" ] && cp -a "$f" /root/baseline/var/lib/pam/
          done
          printf '%s\n' "$baseline_sel" > /root/baseline/selection

          compare_with_baseline() {
            local f
            for f in "${common_files[@]}" /etc/pam.d/sudo; do
              cmp -s "$f" "/root/baseline/etc/pam.d/${f##*/}" \
                || { echo "MISMATCH: $f"; return 1; }
            done
            for f in "${saved_files[@]}"; do
              # Drive the check from the BASELINE: skipping a file that vanished
              # would make this comparison ignore exactly the data loss we test.
              base="/root/baseline/var/lib/pam/${f##*/}"
              [ -e "$base" ] || continue
              [ -e "$f" ] || { echo "MISMATCH: saved file missing: $f"; return 1; }
              cmp -s "$f" "$base" || { echo "MISMATCH: $f"; return 1; }
            done
            [ "$(read_selection)" = "$baseline_sel" ] \
              || { echo "MISMATCH: debconf selection"; return 1; }
          }

          # SENSITIVITY CONTROL: with NO snapshot/convergence, direct sed alone
          # really does make the real tool drop fprintd. This proves the later
          # equality assertions are not vacuous.
          echo "== sensitivity control: sed-only must lose fprintd =="
          sed -i '/pam_fprintd\.so/d' /etc/pam.d/common-auth
          pam-auth-update --package
          if grep -q fprintd <<< "$(read_selection)"; then
            echo "::error::real --package kept fprintd after sed (control not sensitive)"
            exit 1
          fi
          echo "control confirmed: real --package dropped fprintd"

          # Restore the pristine baseline before exercising the installer.
          cp -a /root/baseline/etc/pam.d/common-* /etc/pam.d/
          cp -a /root/baseline/var/lib/pam/. /var/lib/pam/
          printf 'libpam-runtime libpam-runtime/profiles multiselect %s\n' "$baseline_sel" | debconf-set-selections
          pam-auth-update --package
          compare_with_baseline

          echo "== installer -> external package --package -> uninstall =="
          export CROS_ENABLEMENT_PAM_DIR=/etc/pam.d
          export CROS_ENABLEMENT_PAM_SAVED_DIR=/var/lib/pam
          export CROS_ENABLEMENT_PAM_SUDO_PATH=/etc/pam.d/sudo
          export CROS_ENABLEMENT_MANIFEST_DIR=/var/lib/cros-enablement
          export CROS_ENABLEMENT_PAM_SELECTION_FILE=/var/lib/cros-enablement/pam-selection
          export CROS_ENABLEMENT_BACKUP_DIR=/var/backups/cros-enablement
          cd /workspace
          source lib/pam.sh
          DISTRO_FAMILY=debian DISTRO_ID=ubuntu
          export DISTRO_FAMILY DISTRO_ID
          configure_pam_fingerprint
          test -f /var/lib/cros-enablement/pam-selection
          if grep -q fprintd <<< "$(read_selection)"; then
            echo "::error::install did not converge the real debconf selection"
            exit 1
          fi
          # Simulate a package upgrade touching PAM after our install.
          pam-auth-update --package
          # Mirror _uninstall_fp_body(): rollback first, then PAM disable.
          rollback_component "fingerprint"
          disable_pam_fingerprint
          compare_with_baseline
          test ! -e /var/lib/cros-enablement/pam-selection
          echo "PAM E2E OK: selection, common-*, /var/lib/pam and sudo are byte-identical"

          echo "== non-root (passwordless sudo) uninstall with REAL tools =="
          # Restore the pristine baseline before the second round-trip.
          cp -a /root/baseline/etc/pam.d/common-* /etc/pam.d/
          cp -a /root/baseline/var/lib/pam/. /var/lib/pam/
          printf 'libpam-runtime libpam-runtime/profiles multiselect %s\n' "$baseline_sel" | debconf-set-selections
          pam-auth-update --package
          compare_with_baseline

          configure_pam_fingerprint
          pam-auth-update --package
          # uid 1000 reaches privileged files only via passwordless sudo. The
          # root path above used a passthrough stub; here a real setuid-root
          # exec helper models passwordless sudo. (setpriv CANNOT re-escalate:
          # capabilities are dropped when it changes uid.) Install under
          # /usr/local so uid 1000 can traverse it; /root is 0700.
          mkdir -p /usr/local/nonroot-bin
          cat > /usr/local/nonroot-bin/suid-exec.c <<'CEOS'
          #include <unistd.h>
          int main(int argc, char **argv) {
              if (argc < 2) return 127;
              if (setgid(0) != 0) return 126;
              if (setuid(0) != 0) return 125;
              execvp(argv[1], &argv[1]);
              return 127;
          }
          CEOS
          gcc -O2 -o /usr/local/nonroot-bin/suid-exec /usr/local/nonroot-bin/suid-exec.c
          chown 0:0 /usr/local/nonroot-bin/suid-exec
          chmod 4755 /usr/local/nonroot-bin/suid-exec
          printf '#!/bin/bash\nexec /usr/local/nonroot-bin/suid-exec "$@"\n' > /usr/local/nonroot-bin/sudo
