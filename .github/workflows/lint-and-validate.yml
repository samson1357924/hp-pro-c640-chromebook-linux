name: Static Analysis & Hardware Config Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-and-workflows:
    name: Shell Scripts & Workflows Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linting Tools
        run: |
          set -euo pipefail

          # Install actionlint (pinned version with checksum verification)
          curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/

          # Install shfmt (pinned version with checksum verification)
          curl -sSLo shfmt "https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64"
          echo "27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0  shfmt" | sha256sum -c -
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/

      - name: Run actionlint (Workflow & Inline Shell Validation)
        run: |
          actionlint -color

      - name: Run ShellCheck (Modular with External Sources)
        run: |
          shfmt -f . | xargs shellcheck -S warning -x -P lib:scripts:audio:keyboard:fingerprint:power:ec -s bash

      - name: Run shfmt Check (Formatting Consistency)
        run: |
          shfmt -d -i 4 -ci -bn -sr .

  hardware-configs:
    name: Validate hwdb, udev & keyd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate systemd-hwdb & Test DMI Queries
        run: |
          SANDBOX_DIR=$(mktemp -d)
          mkdir -p "${SANDBOX_DIR}/etc/udev/hwdb.d"
          cp keyboard/90-chromebook-keyboard.hwdb "${SANDBOX_DIR}/etc/udev/hwdb.d/"

          # Strict compilation of hwdb binary
          systemd-hwdb --root="${SANDBOX_DIR}" --strict update

          # Query assertion 1: Google Coreboot DMI (Dratini)
          QUERY_DMI1="evdev:atkbd:dmi:bvnGoogle:bvr13579:bd01/01/2021:svnGoogle:pnDratini:pvr1.0"
          HWDB_OUT1=$(systemd-hwdb --root="${SANDBOX_DIR}" query "${QUERY_DMI1}")
          echo "Query Output for Dratini (Coreboot):"
          echo "${HWDB_OUT1}"
          # Every scancode from the inferred fixture must be present. The
          # fixture records 0x3b-0x44 inferred from post-hwdb EVIOCGKEY key
          # state against the AT table (no raw MSC_SCAN capture); asserting
          # only that *some* mapping exists is what let a dead 0xea-0xb0 block
          # ship unnoticed.
          while IFS=$'\t' read -r sc key name; do
            case "${sc}" in ''|'#'*) continue ;; esac
            if ! echo "${HWDB_OUT1}" | grep -q "KEYBOARD_KEY_${sc}=${key}"; then
              echo "FAIL: hwdb is missing KEYBOARD_KEY_${sc}=${key} (${name})"
              exit 1
            fi
          done < keyboard/tests/hwdb-top-row-scancodes.tsv
          # Search must stay leftmeta so keyd can overload it.
          echo "${HWDB_OUT1}" | grep -q "KEYBOARD_KEY_db=leftmeta"
          # Guard against re-adding the ChromeOS action scancodes; this hardware
          # never emits them, so mapping them is dead code.
          if grep -qE "KEYBOARD_KEY_(ea|e9|e7|91|92|ee|ef|a0|ae|b0)=" keyboard/90-chromebook-keyboard.hwdb; then
            echo "FAIL: hwdb maps ChromeOS action scancodes this hardware never sends"
            exit 1
          fi

          # Query assertion 2: HP OEM DMI (HP Pro c640 Chromebook)
          QUERY_DMI2="evdev:atkbd:dmi:bvnHP:bvr13579:bd01/01/2021:svnHP:pnHP Pro c640 Chromebook:pvr1.0"
          HWDB_OUT2=$(systemd-hwdb --root="${SANDBOX_DIR}" query "${QUERY_DMI2}")
          echo "Query Output for HP Pro c640 (OEM):"
          echo "${HWDB_OUT2}"
          echo "${HWDB_OUT2}" | grep -q "KEYBOARD_KEY_3b=back"
          echo "${HWDB_OUT2}" | grep -q "KEYBOARD_KEY_db=leftmeta"
          echo "${HWDB_OUT2}" | grep -q "KEYBOARD_KEY_42=mute"

          # Query assertion 3: other product names containing "Hatch" must NOT match.
          # "Hatch" is the product family on this hardware (pfaGoogle_Hatch),
          # not the product name (pnDratini); a pn*Hatch* wildcard would leak
          # the Dratini-only mapping to any product name that happens to
          # contain "Hatch". These cases exercise that exact regression.
          for BAD_PN in pnHatch pnHatch2 pnGoogle_Hatch; do
            QUERY_DMI_BAD="evdev:atkbd:dmi:bvnGoogle:bvr13579:bd01/01/2021:svnGoogle:${BAD_PN}:pvr1.0"
            HWDB_OUT_BAD=$(systemd-hwdb --root="${SANDBOX_DIR}" query "${QUERY_DMI_BAD}")
            echo "Query Output for ${BAD_PN} (expected: no Dratini mapping):"
            echo "${HWDB_OUT_BAD}"
            if echo "${HWDB_OUT_BAD}" | grep -qE "KEYBOARD_KEY_(3b=back|40=brightnessdown)"; then
              echo "FAIL: non-Dratini product name ${BAD_PN} inherited the Dratini scancode mapping"
              exit 1
            fi
          done

          # Query assertion 4: HP c640 generic wildcard (lower case, matches svnHP*:pn*c640*)
          QUERY_DMI4="evdev:atkbd:dmi:bvnHP:bvr13579:bd01/01/2021:svnHP:pnc640:pvr1.0"
          HWDB_OUT4=$(systemd-hwdb --root="${SANDBOX_DIR}" query "${QUERY_DMI4}")
          echo "Query Output for HP c640 generic:"
          echo "${HWDB_OUT4}"
          echo "${HWDB_OUT4}" | grep -q "KEYBOARD_KEY_3b=back"
          echo "${HWDB_OUT4}" | grep -q "KEYBOARD_KEY_db=leftmeta"

          # Query assertion 5: lower-case dratini (coreboot reports lower on some builds)
          QUERY_DMI5="evdev:atkbd:dmi:bvnGoogle:bvr13579:bd01/01/2021:svnGoogle:pndratini:pvr1.0"
          HWDB_OUT5=$(systemd-hwdb --root="${SANDBOX_DIR}" query "${QUERY_DMI5}")
          echo "Query Output for dratini lower:"
          echo "${HWDB_OUT5}"
          echo "${HWDB_OUT5}" | grep -q "KEYBOARD_KEY_3b=back"
          echo "${HWDB_OUT5}" | grep -q "KEYBOARD_KEY_db=leftmeta"

          # Query assertion 6: real Dratini firmware modalias (extra br/efr fields)
          # Captured from /sys/class/dmi/id/modalias on 2026-10-31. systemd-hwdb
          # matches by DMI key/value, so `bd*:svnGoogle*` must still hit even
          # though br0.0/efr0.0 sit between bd* and svn*.
          QUERY_DMI6="evdev:atkbd:dmi:bvncoreboot:bvrMrChromebox-2606.1:bd07/14/2026:br0.0:efr0.0:svnGoogle:pnDratini:pvrrev4:rvnHP:rnDratini:rvrrev4:cvnGoogle:ct9:cvr:skusku8:pfaGoogle_Hatch:"
          HWDB_OUT6=$(systemd-hwdb --root="${SANDBOX_DIR}" query "${QUERY_DMI6}")
          echo "Query Output for real Dratini modalias:"
          echo "${HWDB_OUT6}"
          echo "${HWDB_OUT6}" | grep -q "KEYBOARD_KEY_db=leftmeta"
          echo "${HWDB_OUT6}" | grep -q "KEYBOARD_KEY_3b=back"
          echo "${HWDB_OUT6}" | grep -q "KEYBOARD_KEY_40=brightnessdown"

          echo "All hwdb key mappings verified (Coreboot/OEM/c640/dratini-lower); non-Dratini Hatch names rejected!"

      - name: Validate udev Rules Syntax
        run: |
          if udevadm --help | grep -q "verify"; then
            udevadm verify fingerprint/60-cros-fp.rules keyboard/udev/61-chromeos-kbd-backlight.rules
          else
            while IFS= read -r -d '' rule_file; do
              echo "Checking $rule_file"
              grep -E 'KERNEL=[^=]' "$rule_file" && { echo "Error: KERNEL must use == for match"; exit 1; }
              grep -E 'SUBSYSTEM=[^=]' "$rule_file" && { echo "Error: SUBSYSTEM must use == for match"; exit 1; }
              grep -E 'TAG=[^=+]' "$rule_file" && { echo "Error: TAG assignment should usually use +="; exit 1; }
            done < <(find . -type f -name "*.rules" -print0)
          fi
          echo "udev rules verified successfully."

      - name: Validate Python Test Tools (syntax + self-test)
        run: |
          # compile()/py_compile does not import, so evdev is not required here.
          # This gates syntax errors in keyboard/tests/*.py into CI.
          python3 -m compileall -q keyboard/tests
          # --self-test returns before the evdev/root checks, so no extra
          # packages are needed on the runner. These are the automated
          # behavioural self-tests: MSC_SCAN output, SYN_DROPPED, EV_ABS
          # collisions and keyd hints, plus the 1/0 down/up pairing assertions
          # (a stuck press with no release must not PASS). A failing self-test
          # exits non-zero; the step's default `bash -e` fails the job.
          python3 keyboard/tests/check-top-row-hwdb.py --self-test
          python3 keyboard/tests/keyd-dualrole-uinput.py --self-test

      - name: Run Keyboard Backlight Shell Unit Tests
        run: |
          # Pure userspace: stub gdbus/sudo/ectool/flock + temp sysfs/state.
          # No sudo, no real D-Bus and no brightness write.
          bash keyboard/tests/kbd-backlight-daemon-test.sh
          bash keyboard/tests/kbd-backlight-sleep-hook-test.sh

      - name: Validate keyd Configuration
        run: |
          # 2.6.0 here is a SYNTAX check only (`keyd check` exists in >= 2.6).
          # Tap/hold/chord-guard behaviour was validated on the device with
          # 2.5.0-5; 2.6.x has known overloadt2 behaviour differences and is
          # NOT behaviourally validated here (see keyboard/README.md).
          git clone --depth 1 --branch v2.6.0 https://github.com/rvaiya/keyd /tmp/keyd-src
          test "$(git -C /tmp/keyd-src rev-parse HEAD)" = "7c0aecb8bfd34dc8642bf4eefd2e59c89e61cec3"
          make -C /tmp/keyd-src
          sudo make -C /tmp/keyd-src install
          keyd check keyboard/keyd/cros.conf
          # Semantic assertion (mirrors the install-smoke check): the core
          # dual-role fix must be the precise overloadt2(meta, capslock, <ms>)
          # form. A plain overload() regresses the GNOME overview hold-on-
          # Search behaviour and a loose grep would not catch it.
          grep -qE '^[[:space:]]*leftmeta[[:space:]]*=[[:space:]]*overloadt2\([[:space:]]*meta[[:space:]]*,[[:space:]]*capslock[[:space:]]*,[[:space:]]*[0-9]+[[:space:]]*\)[[:space:]]*$' keyboard/keyd/cros.conf
          if grep -qE '^[[:space:]]*leftmeta[[:space:]]*=[[:space:]]*overload[[:space:]]*\(' keyboard/keyd/cros.conf; then
            echo "FAIL: plain 'leftmeta = overload()' found; overloadt2(...) is required"
            exit 1
          fi
          echo "keyd configuration valid."
