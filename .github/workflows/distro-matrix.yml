name: Cross-Distro Integration & Docs QA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Containers use /bin/sh by default; force bash so `source` works everywhere
defaults:
  run:
    shell: bash

jobs:
  docs-check:
    name: Markdown Lint & Link Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
          config: '.markdownlint.yaml'

      - name: Check Relative Markdown Links
        run: |
          set -euo pipefail
          # Every relative link must resolve against its own file's directory.
          # (lychee resolves relative links against --base, which does not
          # match how these docs are organized, so this is checked here.)
          fail=0
          while IFS= read -r f; do
            dir=$(dirname "$f")
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              t="${t%% *}"
              case "$t" in
                http://*|https://*|mailto:*|\#*) continue ;;
              esac
              t="${t%%#*}"
              [ -z "$t" ] && continue
              if [ ! -e "$dir/$t" ]; then
                echo "BROKEN: $f -> $t"
                fail=1
              fi
            done < <(grep -oE '\[[^]]*\]\([^)]*\)' "$f" | sed -E 's/^\[[^]]*\]\(([^)]*)\)/\1/')
          done < <(find . -type f -name '*.md' -not -path './.git/*' \
            -not -path './audio/upstream/*' -not -path './github_bot/prompts/*')
          if [ "$fail" -ne 0 ]; then
            echo "::error::Broken relative markdown links found"
            exit 1
          fi

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            "**/*.md"
          # Broken links now fail the check: the docs are the primary
          # user-facing interface of this project. See lychee.toml for the
          # (narrow) exclusion list and accepted status codes.
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  distro-matrix-test:
    name: Distro Matrix (${{ matrix.distro.name }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: "Ubuntu 24.04 (Noble)"
            image: "ubuntu:24.04"
            family: "debian"
            init_cmd: "apt-get update -y && apt-get install -y --no-install-recommends bash coreutils sudo ca-certificates git"
            check_pkgs_cmd: "apt-get install --dry-run -y"

          - name: "Fedora 40"
            image: "fedora:40"
            family: "fedora"
            init_cmd: "dnf install -y bash coreutils sudo git"
            check_pkgs_cmd: "dnf install --assumeyes --downloadonly --destdir=/tmp/ci-dnf-check -y"

          - name: "Arch Linux"
            image: "archlinux:base-devel"
            family: "arch"
            init_cmd: "pacman -Syu --noconfirm --needed bash coreutils sudo git"
            check_pkgs_cmd: "pacman -Sp --needed"

    steps:
      - name: Prepare Minimal Container Environment
        run: |
          ${{ matrix.distro.init_cmd }}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify OS Classification
        run: |
          source ./lib/distro.sh
          echo "Detected Family: $DISTRO_FAMILY ($DISTRO_NAME)"
          if [ "$DISTRO_FAMILY" != "${{ matrix.distro.family }}" ]; then
            echo "Family mismatch: expected ${{ matrix.distro.family }}, got $DISTRO_FAMILY"
            exit 1
          fi

      - name: Verify Dependencies Resolution
        run: |
          source ./lib/distro.sh
          DEPS=$(get_fingerprint_build_deps)
          echo "Resolving packages: $DEPS"
          read -r -a deps_arr <<< "$DEPS"
          ${{ matrix.distro.check_pkgs_cmd }} "${deps_arr[@]}"
          rm -rf /tmp/ci-dnf-check

      - name: Test Setup CLI Dry-Run
        run: |
          chmod +x setup.sh lib/*.sh scripts/*.sh audio/*.sh keyboard/*.sh fingerprint/*.sh
          ./setup.sh --all --dry-run
          ./setup.sh --check --dry-run
          ./setup.sh --uninstall --dry-run
