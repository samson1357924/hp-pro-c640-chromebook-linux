# /etc/keyd/default.conf - Chromebook HP Pro c640 (Dratini) Advanced Key Mapping
# Requires keyd daemon (https://github.com/rvaiya/keyd)
# Hardware prerequisite: keyboard/90-chromebook-keyboard.hwdb must be installed
# so that top-row scancodes (ea/e9/e7/91/92/ee/ef/a0/ae/b0) already translate to
# KEY_BACK etc and Search 0xDB => KEY_LEFTMETA. keyd then provides the
# tap-vs-hold overload and the Meta layer for F1-F10.
# Discover the AT keyboard ID with: sudo keyd monitor

[ids]
# Internal Chromebook keyboard is the AT keyboard (vendor 0001, product 0001).
# Scoping to it avoids grabbing the "Video Bus" (0000:0006) and any external
# USB keyboard, both of which can cause duplicated/odd brightness handling.
0001:0001
# To remap every attached keyboard instead, replace the line above with:
# *
# To also remap an external USB keyboard, add its id from `sudo keyd monitor`.

[global]
# Tune tap-vs-hold timing if needed (ms). Adjust 200-300 for comfort.
# overload_tap_timeout = 200

[main]
# Remap Search/Meta: Tap for CapsLock, Hold for Super (Meta)
leftmeta = overload(meta, capslock)

# Default Top-Row Action Mapping (Media behavior)
back = back
forward = forward
refresh = refresh
f11 = f11
scale = scale
brightnessdown = brightnessdown
brightnessup = brightnessup
mute = mute
volumedown = volumedown
volumeup = volumeup

# Hold Meta (Search key) to access standard function keys F1-F10
# Requires hwdb: back/scale etc names exist only after hwdb translation
[meta:M]
back = f1
forward = f2
refresh = f3
f11 = f4
scale = f5
brightnessdown = f6
brightnessup = f7
mute = f8
volumedown = f9
volumeup = f10

# GNOME Wayland note: if trackpad stalls while typing, add libinput quirk:
# /etc/libinput/local-overrides.quirks:
# [Keyd]
# MatchName=keyd virtual keyboard
# AttrKeyboardIntegration=internal
