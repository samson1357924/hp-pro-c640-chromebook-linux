# /etc/keyd/cros.conf - Chromebook HP Pro c640 (Dratini) Advanced Key Mapping
# Requires keyd daemon (https://github.com/rvaiya/keyd)
# Hardware prerequisite: keyboard/90-chromebook-keyboard.hwdb must be installed
# so that the physical top-row scancodes 0x3b-0x44 become KEY_BACK,
# KEY_BRIGHTNESSDOWN, ... (see that file for the measured mapping) and Search
# 0xDB stays KEY_LEFTMETA. keyd then provides the tap-vs-hold overload and the
# Meta layer for F1-F10.
# Need another keyboard's id? keyd 2.5.x cannot open a device it already holds,
# so `keyd monitor` will not show the internal Chromebook keyboard; use
# `sudo python3 keyboard/tests/capture-keyd-output.py` (read-only) instead.

[ids]
# Internal Chromebook keyboard is the AT keyboard (vendor 0001, product 0001).
# Scoping to it avoids grabbing the "Video Bus" (0000:0006) and any external
# USB keyboard, both of which can cause duplicated/odd brightness handling.
0001:0001
# To remap every attached keyboard instead, replace the line above with:
# *
# To also remap an external USB keyboard, add its id from `sudo keyd monitor`.

[global]
# overloadt2() already carries its own 200ms timeout below. The global option
# only affects plain overload(), so it is left unset here.

[main]
# Tap = CapsLock, hold = Super (Meta), Search+top row = F1-F10.
#
# overloadt2 (not overload) is required: plain overload() activates the Meta
# layer on press and keyd's clear_mod() then inserts a LEFTCTRL guard when the
# key is released in isolation (src/keyboard.c). Mutter treats that
# Meta+Ctrl press as a shortcut combo, so a held Search never opened the GNOME
# overview. overloadt2 defers the decision, and its OP_LAYER release path sets
# inhibit_modifier_guard, so a pure hold release emits a clean lone LEFTMETA
# that Mutter recognises as the overlay key.
#
# 200ms = tap/hold threshold. Release sooner for CapsLock, hold longer for
# Super. Key presses that happen while the key is down resolve as a hold.
leftmeta = overloadt2(meta, capslock, 200)

# Top-row keys are intentionally NOT remapped here: keyd passes unmapped keys
# through unchanged, so the hwdb translation (back/refresh/brightnessdown/...)
# keeps working on a single press.
#
# Hold Meta (Search key) to access standard function keys F1-F10
# Requires hwdb: back/scale etc names exist only after hwdb translation
[meta:M]
back = f1
forward = f2
refresh = f3
f11 = f4
scale = f5
brightnessdown = f6
brightnessup = f7
mute = f8
volumedown = f9
volumeup = f10

# GNOME Wayland note: if trackpad stalls while typing, add libinput quirk:
# /etc/libinput/local-overrides.quirks:
# [Keyd]
# MatchName=keyd virtual keyboard
# AttrKeyboardIntegration=internal
