# /etc/keyd/default.conf - Chromebook HP Pro c640 (Dratini) Advanced Key Mapping
# Requires keyd daemon (https://github.com/rvaiya/keyd)

[ids]
*

[main]
# Remap Search/Meta: Tap for CapsLock, Hold for Super (Meta)
leftmeta = overload(meta, capslock)

# Default Top-Row Action Mapping (Media behavior)
back = back
forward = forward
refresh = refresh
f11 = f11
scale = scale
brightnessdown = brightnessdown
brightnessup = brightnessup
mute = mute
volumedown = volumedown
volumeup = volumeup

# Hold Meta (Search key) to access standard function keys F1-F10
[meta:M]
back = f1
forward = f2
refresh = f3
f11 = f4
scale = f5
brightnessdown = f6
brightnessup = f7
mute = f8
volumedown = f9
volumeup = f10
