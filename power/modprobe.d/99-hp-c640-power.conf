# /etc/modprobe.d/99-hp-c640-power.conf
# HP Pro c640 (Intel Comet Lake-U) Graphics and Wireless Power Tuning

# i915: Disable PSR (Panel Self Refresh) to eliminate suspend/resume black screen freezes,
# while enabling FBC (Framebuffer Compression) and GuC submission for low power consumption.
options i915 enable_psr=0 enable_fbc=1 enable_guc=2

# iwlwifi: Enable power saving while maintaining low latency D0i3 state
options iwlwifi power_save=1 uapsd_disable=0 d0i3_disable=0
