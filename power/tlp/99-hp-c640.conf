# ==============================================================================
# HP Pro c640 Chromebook (Intel Comet Lake-U) TLP Power Optimization Profile
# ==============================================================================

# --- CPU Scaling & Energy Performance Preference (intel_pstate / HWP) ---
CPU_SCALING_GOVERNOR_ON_AC="powersave"
CPU_SCALING_GOVERNOR_ON_BAT="powersave"

# EPP: performance / balance_performance / balance_power / power
CPU_ENERGY_PERF_POLICY_ON_AC="balance_performance"
CPU_ENERGY_PERF_POLICY_ON_BAT="balance_power"

# Frequency limits on battery to reduce burst thermal spikes
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=80

# Turbo Boost on AC only
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- PCIe ASPM Bus Energy Saving (Crucial for Package C10 and S0ix) ---
PCIE_ASPM_ON_AC="default"
PCIE_ASPM_ON_BAT="powersupersave"

# --- Intel UHD 620/630 Graphics Dynamic Frequencies ---
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_BAT=850
INTEL_GPU_BOOST_FREQ_ON_BAT=950

# --- Storage & Runtime PM ---
AHCI_RUNTIME_PM_ON_BAT="auto"
RUNTIME_PM_ON_AC="on"
RUNTIME_PM_ON_BAT="auto"

# --- Audio & Wireless Power Saving ---
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

WIFI_PWR_ON_AC="off"
WIFI_PWR_ON_BAT="on"

# --- USB Autosuspend ---
USB_AUTOSUSPEND=1
# Exclude ChromeOS EC & FPMCU devices from autosuspend disruption
USB_DENYLIST="18d1:5002"
