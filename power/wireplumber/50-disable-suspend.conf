# /etc/wireplumber/wireplumber.conf.d/50-disable-suspend.conf
# Prevent ALSA node suspension on idle to eliminate hardware popping noise on RT5682 / MAX98357A
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
