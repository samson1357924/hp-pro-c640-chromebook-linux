# Ruff configuration for the GitHub AI Bot Python code.
[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# Keep the check surface deliberately small: hard errors, unused imports,
# f-strings, and import ordering.
select = ["E4", "E7", "E9", "F", "I"]
