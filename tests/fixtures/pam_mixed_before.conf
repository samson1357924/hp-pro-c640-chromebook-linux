# Reviewer's mixed auth/account fixture. A file-global module index sees the
# `success=1` landing as `account:pam_permit.so` before AND after fp removal;
# the real auth stack lands on the fake fp module before and on the final
# pam_permit afterwards (libpam decision 7 -> 0).
auth [success=1 default=ignore] @PERMIT@ src
auth requisite @DENY@ skipme
account required @PERMIT@ acct
auth required @FAKEMOD@ fp
auth required @PERMIT@ final
