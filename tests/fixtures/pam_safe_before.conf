# Normal Debian profile shape: the fp rule is BEFORE the numeric-jump source,
# so removing it does not change the real auth landing (the final pam_permit).
auth sufficient @FAKEMOD@ allow
auth [success=1 default=ignore] @PERMIT@ src
auth requisite @DENY@ deny
auth required @PERMIT@ final
