# Re-review #19 P0: `session include extra` is TYPE-PREFIXED, so it introduces
# only session lines.  The real auth stack is src -> skipme -> fp -> final:
# success=1 lands on the fake fp module (PAM_AUTH_ERR => decision 7).  After
# the fp rule is removed it lands on the final pam_permit (decision 0), which
# is UNSAFE.  A group-agnostic model wrongly inserts extra's auth rule into
# the auth stack and sees an unchanged landing (a SAFE false negative).
auth [success=1 default=ignore] @PERMIT@ src
session include extra
auth required @DENY@ skipme
auth required @FAKEMOD@ fp
auth required @PERMIT@ final
